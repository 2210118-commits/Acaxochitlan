workflows:
  ios-release:
    name: iOS IPA Release

    max_build_duration: 60

    integrations:
      app_store_connect: Codemagic iOS

    environment:
      flutter: stable
      xcode: latest

      vars:
        BUNDLE_ID: "com.acaxochi.turismo"

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.acaxochi.turismo

    scripts:
      - name: Clean Flutter project
        script: |
          flutter clean
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..

      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files com.acaxochi.turismo \
            --type IOS_APP_STORE \
            --create

          keychain initialize

          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          flutter build ipa \
            --release \
            --export-method app-store \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true