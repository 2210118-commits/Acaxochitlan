workflows:
  ios-release:
    name: iOS IPA Release

    max_build_duration: 60

    integrations:
      app_store_connect: Codemagic

    environment:
      flutter: stable
      xcode: latest

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.acaxochi.turismo

    scripts:
      - name: Clean & packages
        script: |
          flutter clean
          flutter pub get

      - name: Install pods
        script: |
          cd ios
          pod install
          cd ..

      - name: Set up signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          flutter build ipa \
            --release \
            --export-method app-store

      - name: Check IPA
        script: |
          ls -R build/ios/ipa/

    artifacts:
      - build/ios/ipa/*.ipa